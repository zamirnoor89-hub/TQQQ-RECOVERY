services:
  - type: web
    name: tqqq-recovery
    runtime: node
    plan: starter            # persistent disks need a paid instance
    region: singapore
    buildCommand: node build.mjs
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TWELVE_DATA_API_KEY
        sync: false          # Render asks you for it; never commit it
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: tqqq-data
      mountPath: /var/data
      sizeGB: 1
